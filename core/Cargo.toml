[package]
name = "guilder-core"
version = "0.8.0"
edition = "2021"
description = "reusable trading components (orderbook, currency pair, engine) for guilder"
authors = ["Sho Kaneko <kanekoshoyu@gmail.com>"]
repository = "https://github.com/kanekoshoyu/guilder"
license = "MIT"

[features]
engine = ["tokio", "tokio-stream", "rust_decimal", "futures", "serde", "chrono", "tracing"]
account = ["rust_decimal", "chrono", "uuid", "serde", "tokio", "tracing", "arc-swap"]

[dependencies]
# development: path, deployment: version
guilder-abstraction = "0.1.23"
tokio = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }
rust_decimal = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
# account feature deps
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
arc-swap = { version = "1", optional = true }

[dev-dependencies]
rust_decimal_macros = "1"
