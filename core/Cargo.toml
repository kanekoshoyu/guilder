[package]
name = "guilder-core"
version = "0.3.2"
edition = "2021"
description = "reusable trading components (orderbook, currency pair, engine) for guilder"
authors = ["Sho Kaneko <kanekoshoyu@gmail.com>"]
repository = "https://github.com/kanekoshoyu/guilder"
license = "MIT"

[features]
engine = ["dashmap", "tokio", "tokio-stream", "rust_decimal", "futures"]

[dependencies]
# development: path, deployment: version
guilder-abstraction = { path = "../abstraction/target/rust", version = "0.1.1" }
ordered-float.workspace = true
# engine feature deps
dashmap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }
rust_decimal = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
