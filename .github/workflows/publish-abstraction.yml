name: publish guilder-abstraction

on:
  push:
    tags:
      - "abstraction-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: run codegen
        working-directory: abstraction/codegen
        run: cargo run

      - name: verify no uncommitted codegen changes
        run: |
          git diff --exit-code abstraction/target/
          if [ $? -ne 0 ]; then
            echo "generated files are out of sync with trading.yaml — run codegen and commit"
            exit 1
          fi

      - name: publish to crates.io
        working-directory: abstraction/target/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
