name: publish guilder-client-hyperliquid

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: verify version not already published
        working-directory: client/guilder-client-hyperliquid
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "publishing version: $VERSION"
          if curl -s https://crates.io/api/v1/crates/guilder-client-hyperliquid | grep -q "\"num\":.*\"$VERSION\""; then
            echo "version $VERSION already on crates.io — nothing to do"
            exit 1
          fi

      - name: dry-run package build
        working-directory: client/guilder-client-hyperliquid
        run: cargo publish --dry-run --allow-dirty

      - name: publish to crates.io
        working-directory: client/guilder-client-hyperliquid
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
