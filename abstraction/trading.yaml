traits:
  - name: TestServer
    description: test server network connection
    async: true
    methods:
      - name: ping
        description: test ping
        return_type: bool
      - name: get_server_time
        description: get server local time
        return_type: i64

  - name: GetMarketData
    description: get market data such as symbol, price and volume
    async: true
    methods:
      - name: get_symbol
        description: get symbol, such as BTCUSD
        return_type: Vec<String>
      - name: get_price
        description: get mid-price of a symbol (e.g. BTCUSD -> 67000.0)
        return_type: f64
        args:
          - name: symbol
            type: String
  # TODO define get_ohlcv,
  # first check what is the common API
  # and then see if we can map this with yaml
  # - name: get_ohlcv
  # return_type: String # return type I assume is a little more complex
  # - name: get_ohlcv
  #   return_type: String
  #   args:
  #     - name: name

  - name: ManageOrder
    description: place, change, cancel order
    async: true
    methods:
      - name: place_order
        description: place order, return cloid
        args:
          - name: symbol
            type: String
          - name: price
            type: i32
          - name: volume
            type: i32
        return_type: i64
      - name: change_order_by_cloid
        description: change order
        args:
          - name: cloid
            type: i64
          - name: price
            type: i32
          - name: volume
            type: i32
        return_type: i64
      - name: cancel_order
        description: cancel order by cloid
        args:
          - name: cloid
            type: i64
        return_type: i64
      - name: cancel_all_order
        description: cancel all order regardless of cloid/symbol
        return_type: bool

  - name: SubscribeMarketData
    description: subscribe to streaming market data
    async: true
    methods:
      - name: subscribe_l2_update
        description: subscribe to L2 orderbook updates for a symbol
        return_type: Stream<L2Update>
        args:
          - name: symbol
            type: String
      - name: subscribe_fill
        description: subscribe to market fill events for a symbol
        return_type: Stream<Fill>
        args:
          - name: symbol
            type: String

# enum: keep it primitive
enums:
  - name: Status
    values:
      - name: Success
        description: "The task is pending."
      - name: InProgress
        description: "The task is currently in progress."
      - name: Completed
        description: "The task has been completed."
      - name: Failed
        description: "The task has failed."

  - name: Side
    description: "orderbook side"
    values:
      - name: Bid
        description: "bid side of the orderbook"
      - name: Ask
        description: "ask side of the orderbook"

  - name: OrderSide
    description: "direction of an order"
    values:
      - name: Buy
        description: "buy order"
      - name: Sell
        description: "sell order"

  - name: MarketType
    description: "type of market"
    values:
      - name: Spot
        description: "spot market"
      - name: Future
        description: "dated futures contract"
      - name: Perpetual
        description: "perpetual futures contract"

  - name: OrderType
    description: "order execution type"
    values:
      - name: Market
        description: "execute immediately at best available price"
      - name: Limit
        description: "execute at specified price or better"

  - name: TimeInForce
    description: "how long an order remains active"
    values:
      - name: Gtc
        description: "good till cancel"
      - name: Ioc
        description: "immediate or cancel"
      - name: Fok
        description: "fill or kill"

  - name: VolumeDenomination
    description: "which currency the volume is expressed in"
    values:
      - name: Base
        description: "volume in base currency (e.g. BTC in BTC-USDT)"
      - name: Quote
        description: "volume in quote currency (e.g. USDT in BTC-USDT)"

  - name: AssetClass
    description: "broad class of an asset"
    values:
      - name: Crypto
        description: "non-stable cryptocurrency"
      - name: Stablecoin
        description: "price-stable cryptocurrency"
      - name: Fiat
        description: "government-issued currency"

# struct: either primitive or enum
structs:
  - name: L2Update
    description: "single L2 orderbook price level update"
    values:
      - name: symbol
        type: String
      - name: price
        type: f64
      - name: volume
        type: f64
      - name: side
        type: Side
      - name: sequence
        type: i64

  - name: Fill
    description: "market trade/fill event"
    values:
      - name: symbol
        type: String
      - name: price
        type: f64
      - name: volume
        type: f64
      - name: side
        type: OrderSide
      - name: timestamp
        type: i64
      - name: trade_id
        type: i64
