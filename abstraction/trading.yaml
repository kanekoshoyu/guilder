traits:
  - name: TestServer
    description: test server network connection
    async: true
    methods:
      - name: ping
        description: test ping
        return_type: Result<bool, String>

      - name: get_server_time
        description: get server local time
        return_type: Result<i64, String>

  - name: GetMarketData
    description: get market data such as symbol, price and volume
    async: true
    methods:
      - name: get_symbol
        description: get symbol, such as BTCUSD
        return_type: Result<Vec<String>, String>

      - name: get_price
        description: get mid-price of a symbol (e.g. BTCUSD -> 67000.0)
        return_type: Result<Decimal, String>
        args:
          - name: symbol
            type: String

      - name: get_open_interest
        description: get current open interest for a symbol
        return_type: Result<Decimal, String>
        args:
          - name: symbol
            type: String

      - name: get_asset_context
        description: get snapshot of market metrics (OI, funding rate, mark price, 24h volume)
        return_type: Result<AssetContext, String>
        args:
          - name: symbol
            type: String

      - name: get_all_asset_contexts
        description: get all asset context snapshots in one call (prefer over repeated get_asset_context)
        return_type: Result<Vec<AssetContext>, String>

      - name: get_sz_decimals
        description: get the number of decimal places for order size for a symbol (static metadata)
        return_type: Result<i32, String>
        args:
          - name: symbol
            type: String

      - name: get_all_sz_decimals
        description: get sz_decimals for all symbols in one call (prefer over repeated get_sz_decimals)
        return_type: Result<HashMap<String, i32>, String>

      - name: get_predicted_fundings
        description: get predicted funding rates for all symbols across all venues
        return_type: Result<Vec<PredictedFunding>, String>

      - name: get_l2_orderbook
        description: get full L2 orderbook snapshot for a symbol (for initialization)
        return_type: Result<L2Snapshot, String>
        args:
          - name: symbol
            type: String

  - name: ManageOrder
    description: place, change, cancel order
    async: true
    methods:
      - name: place_order
        description: place order with optional client order ID for end-to-end tracking
        args:
          - name: symbol
            type: String
          - name: side
            type: OrderSide
          - name: price
            type: Decimal
          - name: volume
            type: Decimal
          - name: order_type
            type: OrderType
          - name: time_in_force
            type: TimeInForce
          - name: trigger_price
            type: Option<Decimal>
          - name: reduce_only
            type: bool
          - name: cloid
            type: Option<String>
        return_type: Result<OrderPlacement, String>

      - name: change_order_by_cloid
        description: change order
        args:
          - name: cloid
            type: i64
          - name: price
            type: Decimal
          - name: volume
            type: Decimal
        return_type: Result<i64, String>

      - name: cancel_order_by_cloid
        description: cancel order by cloid
        args:
          - name: cloid
            type: String
        return_type: Result<(), String>

      - name: cancel_all_order
        description: cancel all order regardless of cloid/symbol
        return_type: Result<bool, String>

  - name: SubscribeMarketData
    description: subscribe to streaming market data
    async: true
    methods:
      - name: subscribe_l2_update
        description: subscribe to L2 orderbook updates for a symbol
        return_type: Stream<Result<L2Update, String>>
        args:
          - name: symbol
            type: String

      - name: subscribe_l2_snapshot
        description: subscribe to full L2 orderbook snapshots for a symbol
        return_type: Stream<Result<L2Snapshot, String>>
        args:
          - name: symbol
            type: String

      - name: subscribe_fill
        description: subscribe to market fill events for a symbol
        return_type: Stream<Result<Fill, String>>
        args:
          - name: symbol
            type: String

      - name: subscribe_asset_context
        description: subscribe to asset context updates (OI, funding rate, mark price, 24h volume)
        return_type: Stream<Result<AssetContext, String>>
        args:
          - name: symbol
            type: String

      - name: subscribe_liquidation
        description: subscribe to liquidation events for a user address
        return_type: Stream<Result<Liquidation, String>>
        args:
          - name: user
            type: String

      - name: unsubscribe_all
        description: unsubscribe from all market data streams (graceful shutdown)
        return_type: "()"

  - name: GetAccountSnapshot
    description: query authenticated account snapshot
    async: true
    methods:
      - name: get_positions
        description: get current open positions
        return_type: Result<Vec<Position>, String>

      - name: get_open_orders
        description: get currently resting orders
        return_type: Result<Vec<OpenOrder>, String>

      - name: get_balance
        description: get all per-asset account balances with margin health
        return_type: Result<Vec<AccountBalance>, String>

      - name: get_user_rate_limit
        description: get user's address-level API rate limit budget (remaining requests, cumulative volume, cap)
        return_type: Result<UserRateLimit, String>

  - name: SubscribeUserEvents
    description: subscribe to authenticated user account events
    async: true
    methods:
      - name: subscribe_user_fills
        description: stream executions of the user's own orders
        return_type: Stream<Result<UserFill, String>>

      - name: subscribe_order_updates
        description: stream order lifecycle updates
        return_type: Stream<Result<OrderUpdate, String>>

      - name: subscribe_funding_payments
        description: stream funding payments applied to positions
        return_type: Stream<Result<FundingPayment, String>>

      - name: subscribe_deposits
        description: stream account deposit events
        return_type: Stream<Result<Deposit, String>>

      - name: subscribe_withdrawals
        description: stream account withdrawal events
        return_type: Stream<Result<Withdrawal, String>>

      - name: subscribe_spot_balance
        description: subscribe to spot wallet balance updates for the registered user address (requires authentication)
        return_type: Stream<Result<Vec<AccountBalance>, String>>

      - name: subscribe_spot_balance_with_address
        description: subscribe to spot wallet balance updates for a specific address
        return_type: Stream<Result<Vec<AccountBalance>, String>>
        args:
          - name: address
            type: String

      - name: unsubscribe_user_events
        description: unsubscribe from all user event streams
        return_type: "()"

  - name: SubscribeMarketDataOps
    description: operational helpers for market data subscriptions (unsubscribe)
    async: true
    methods:
      - name: unsubscribe_market_data
        description: unsubscribe from market data streams for a symbol
        return_type: "()"
        args:
          - name: symbol
            type: String


  - name: ListingEventSource
    description: authoritative token lifecycle events (list/delist) straight from the exchange
    async: true
    methods:
      - name: get_listing_events
        description: full listing/delist event stream; exchange is the single source of truth
        return_type: Result<Vec<ListingEvent>, String>

      - name: get_current_universe
        description: tickers tradeable right now (with delist flag where the venue exposes it)
        return_type: Result<Vec<SymbolStatus>, String>


enums:
  - name: Status
    values:
      - name: Success
        description: task succeeded
      - name: InProgress
        description: task currently in progress
      - name: Completed
        description: task completed
      - name: Failed
        description: task failed

  - name: Side
    description: orderbook side
    values:
      - name: Bid
        description: bid side
      - name: Ask
        description: ask side

  - name: OrderSide
    description: direction of an order
    values:
      - name: Buy
        description: buy order
      - name: Sell
        description: sell order

  - name: OrderStatus
    description: lifecycle state of an order
    values:
      - name: Placed
        description: order accepted by exchange
      - name: PartiallyFilled
        description: order partially filled
      - name: Filled
        description: order fully filled
      - name: Cancelled
        description: order cancelled

  - name: MarketType
    description: type of market
    values:
      - name: Spot
        description: spot market
      - name: Future
        description: dated futures
      - name: Perpetual
        description: perpetual futures

  - name: OrderType
    description: order execution type
    values:
      - name: Market
        description: execute immediately at market price
      - name: Limit
        description: execute at specified price or better
      - name: TakeProfit
        description: trigger order that fires as market/limit when price reaches take-profit level
      - name: StopLoss
        description: trigger order that fires as market/limit when price reaches stop-loss level

  - name: TimeInForce
    description: how long an order remains active
    values:
      - name: Gtc
        description: good till cancel
      - name: Ioc
        description: immediate or cancel
      - name: Fok
        description: fill or kill
      - name: Alo
        description: add liquidity only (post-only, never taker)

  - name: VolumeDenomination
    description: which currency the volume is expressed in
    values:
      - name: Base
        description: base currency
      - name: Quote
        description: quote currency

  - name: AssetClass
    description: broad class of asset
    values:
      - name: Crypto
        description: cryptocurrency
      - name: Stablecoin
        description: stablecoin
      - name: Fiat
        description: fiat currency




structs:
  - name: ListingEvent
    description: one lifecycle event for one symbol on one venue
    values:
      - name: ticker
        type: String
      - name: exchange
        type: String
      - name: event
        type: String
      - name: event_time
        type: String

  - name: SymbolStatus
    description: current tradeable status of one symbol
    values:
      - name: ticker
        type: String
      - name: exchange
        type: String
      - name: is_delisted
        type: bool

  - name: L2Update
    description: single L2 orderbook price level update
    values:
      - name: symbol
        type: String
      - name: price
        type: Decimal
      - name: volume
        type: Decimal
      - name: side
        type: Side
      - name: sequence
        type: i64

  - name: L2Level
    description: single price level within an L2 snapshot
    values:
      - name: price
        type: Decimal
      - name: volume
        type: Decimal

  - name: L2Snapshot
    description: full L2 orderbook snapshot
    values:
      - name: symbol
        type: String
      - name: bids
        type: Vec<L2Level>
      - name: asks
        type: Vec<L2Level>
      - name: sequence
        type: i64

  - name: Liquidation
    description: forced liquidation event
    values:
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: liquidated_user
        type: String
      - name: notional_position
        type: Decimal
      - name: account_value
        type: Decimal

  - name: AssetContext
    description: snapshot of market metrics
    values:
      - name: symbol
        type: String
      - name: open_interest
        type: Decimal
      - name: funding_rate
        type: Decimal
      - name: mark_price
        type: Decimal
      - name: day_volume
        type: Decimal
      - name: mid_price
        type: Option<Decimal>
      - name: oracle_price
        type: Option<Decimal>
      - name: premium
        type: Option<Decimal>
      - name: prev_day_price
        type: Option<Decimal>
      - name: sz_decimals
        type: i32
        description: number of decimal places for order size (e.g. Hyperliquid szDecimals)

  - name: PredictedFunding
    description: predicted funding rate for a symbol at a venue
    values:
      - name: symbol
        type: String
      - name: venue
        type: String
      - name: funding_rate
        type: Decimal
      - name: next_funding_time_ms
        type: i64

  - name: Fill
    description: market trade event
    values:
      - name: symbol
        type: String
      - name: price
        type: Decimal
      - name: volume
        type: Decimal
      - name: side
        type: OrderSide
      - name: timestamp_ms
        type: i64
      - name: trade_id
        type: i64

  - name: Position
    description: open trading position
    values:
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: size
        type: Decimal
      - name: entry_price
        type: Decimal

  - name: OpenOrder
    description: resting order
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: price
        type: Decimal
      - name: quantity
        type: Decimal
      - name: filled_quantity
        type: Decimal
      - name: order_type
        type: Option<OrderType>
      - name: trigger_price
        type: Option<Decimal>
      - name: reduce_only
        type: bool

  - name: OrderPlacement
    description: order placement response
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: price
        type: Decimal
      - name: quantity
        type: Decimal
      - name: timestamp_ms
        type: i64
      - name: cloid
        type: Option<String>
      - name: order_type
        type: OrderType
      - name: trigger_price
        type: Option<Decimal>
      - name: reduce_only
        type: bool

  - name: UserFill
    description: execution of the user's own order
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: price
        type: Decimal
      - name: quantity
        type: Decimal
      - name: fee_usd
        type: Decimal
      - name: timestamp_ms
        type: i64
      - name: cloid
        type: Option<String>

  - name: OrderUpdate
    description: order lifecycle update
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: status
        type: OrderStatus
      - name: side
        type: Option<OrderSide>
      - name: price
        type: Option<Decimal>
      - name: quantity
        type: Option<Decimal>
      - name: remaining_quantity
        type: Option<Decimal>
      - name: timestamp_ms
        type: i64
      - name: cloid
        type: Option<String>

  - name: FundingPayment
    description: funding payment applied to a position
    values:
      - name: symbol
        type: String
      - name: amount_usd
        type: Decimal
      - name: timestamp_ms
        type: i64

  - name: Deposit
    description: deposit event
    values:
      - name: asset
        type: String
      - name: amount_usd
        type: Decimal
      - name: timestamp_ms
        type: i64

  - name: Withdrawal
    description: withdrawal event
    values:
      - name: asset
        type: String
      - name: amount_usd
        type: Decimal
      - name: timestamp_ms
        type: i64

  - name: AccountBalance
    description: per-asset balance from spotClearinghouseState with margin health
    values:
      - name: token
        type: String
        description: asset symbol (e.g. "USDC")
      - name: equity
        type: Decimal
        description: total value (balances.total)
      - name: free
        type: Decimal
        description: equity minus holds (equity - hold)
      - name: safe
        type: Option<Decimal>
        description: equity minus maintenance margin (tokenToAvailableAfterMaintenance[token])
      - name: usable
        type: Decimal
        description: min(free, safe.unwrap_or(free))
      - name: hold
        type: Decimal
        description: locked in open orders (balances.hold)
      - name: margin_used
        type: Option<Decimal>
        description: margin used for positions (None for spot-only assets)
      - name: maintenance
        type: Option<Decimal>
        description: maintenance margin requirement (computed as equity - safe when safe exists)

  - name: UserRateLimit
    description: user's address-level API rate limit budget from Hyperliquid's userRateLimit endpoint
    values:
      - name: cumulative_volume
        type: Decimal
        description: cumulative trading volume in USDC
      - name: requests_used
        type: i64
        description: number of API requests consumed
      - name: requests_cap
        type: i64
        description: total request allowance
      - name: requests_surplus
        type: i64
        description: remaining reserved capacity
