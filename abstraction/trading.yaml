traits:
  - name: TestServer
    description: test server network connection
    async: true
    methods:
      - name: ping
        description: test ping
        return_type: Result<bool, String>

      - name: get_server_time
        description: get server local time
        return_type: Result<i64, String>

  - name: GetMarketData
    description: get market data such as symbol, price and volume
    async: true
    methods:
      - name: get_symbol
        description: get symbol, such as BTCUSD
        return_type: Result<Vec<String>, String>

      - name: get_price
        description: get mid-price of a symbol (e.g. BTCUSD -> 67000.0)
        return_type: Result<Decimal, String>
        args:
          - name: symbol
            type: String

      - name: get_open_interest
        description: get current open interest for a symbol
        return_type: Result<Decimal, String>
        args:
          - name: symbol
            type: String

  - name: ManageOrder
    description: place, change, cancel order
    async: true
    methods:
      - name: place_order
        description: place order
        args:
          - name: symbol
            type: String
          - name: side
            type: OrderSide
          - name: price
            type: Decimal
          - name: volume
            type: Decimal
          - name: order_type
            type: OrderType
          - name: time_in_force
            type: TimeInForce
        return_type: Result<OrderPlacement, String>

      - name: change_order_by_cloid
        description: change order
        args:
          - name: cloid
            type: i64
          - name: price
            type: Decimal
          - name: volume
            type: Decimal
        return_type: Result<i64, String>

      - name: cancel_order
        description: cancel order by cloid
        args:
          - name: cloid
            type: i64
        return_type: Result<i64, String>

      - name: cancel_all_order
        description: cancel all order regardless of cloid/symbol
        return_type: Result<bool, String>

  - name: SubscribeMarketData
    description: subscribe to streaming market data
    async: true
    methods:
      - name: subscribe_l2_update
        description: subscribe to L2 orderbook updates for a symbol
        return_type: Stream<L2Update>
        args:
          - name: symbol
            type: String

      - name: subscribe_fill
        description: subscribe to market fill events for a symbol
        return_type: Stream<Fill>
        args:
          - name: symbol
            type: String

      - name: subscribe_asset_context
        description: subscribe to asset context updates (OI, funding rate, mark price, 24h volume)
        return_type: Stream<AssetContext>
        args:
          - name: symbol
            type: String

      - name: subscribe_liquidation
        description: subscribe to liquidation events for a user address
        return_type: Stream<Liquidation>
        args:
          - name: user
            type: String

  - name: GetAccountSnapshot
    description: query authenticated account snapshot
    async: true
    methods:
      - name: get_positions
        description: get current open positions
        return_type: Result<Vec<Position>, String>

      - name: get_open_orders
        description: get currently resting orders
        return_type: Result<Vec<OpenOrder>, String>

      - name: get_collateral
        description: get available account collateral
        return_type: Result<Decimal, String>

  - name: SubscribeUserEvents
    description: subscribe to authenticated user account events
    async: true
    methods:
      - name: subscribe_user_fills
        description: stream executions of the user's own orders
        return_type: Stream<UserFill>

      - name: subscribe_order_updates
        description: stream order lifecycle updates
        return_type: Stream<OrderUpdate>

      - name: subscribe_funding_payments
        description: stream funding payments applied to positions
        return_type: Stream<FundingPayment>

      - name: subscribe_deposits
        description: stream account deposit events
        return_type: Stream<Deposit>

      - name: subscribe_withdrawals
        description: stream account withdrawal events
        return_type: Stream<Withdrawal>


enums:
  - name: Status
    values:
      - name: Success
        description: task succeeded
      - name: InProgress
        description: task currently in progress
      - name: Completed
        description: task completed
      - name: Failed
        description: task failed

  - name: Side
    description: orderbook side
    values:
      - name: Bid
        description: bid side
      - name: Ask
        description: ask side

  - name: OrderSide
    description: direction of an order
    values:
      - name: Buy
        description: buy order
      - name: Sell
        description: sell order

  - name: OrderStatus
    description: lifecycle state of an order
    values:
      - name: Placed
        description: order accepted by exchange
      - name: PartiallyFilled
        description: order partially filled
      - name: Filled
        description: order fully filled
      - name: Cancelled
        description: order cancelled

  - name: MarketType
    description: type of market
    values:
      - name: Spot
        description: spot market
      - name: Future
        description: dated futures
      - name: Perpetual
        description: perpetual futures

  - name: OrderType
    description: order execution type
    values:
      - name: Market
        description: execute immediately
      - name: Limit
        description: execute at specified price

  - name: TimeInForce
    description: how long an order remains active
    values:
      - name: Gtc
        description: good till cancel
      - name: Ioc
        description: immediate or cancel
      - name: Fok
        description: fill or kill

  - name: VolumeDenomination
    description: which currency the volume is expressed in
    values:
      - name: Base
        description: base currency
      - name: Quote
        description: quote currency

  - name: AssetClass
    description: broad class of asset
    values:
      - name: Crypto
        description: cryptocurrency
      - name: Stablecoin
        description: stablecoin
      - name: Fiat
        description: fiat currency


structs:
  - name: L2Update
    description: single L2 orderbook price level update
    values:
      - name: symbol
        type: String
      - name: price
        type: Decimal
      - name: volume
        type: Decimal
      - name: side
        type: Side
      - name: sequence
        type: i64

  - name: Liquidation
    description: forced liquidation event
    values:
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: liquidated_user
        type: String
      - name: notional_position
        type: Decimal
      - name: account_value
        type: Decimal

  - name: AssetContext
    description: snapshot of market metrics
    values:
      - name: symbol
        type: String
      - name: open_interest
        type: Decimal
      - name: funding_rate
        type: Decimal
      - name: mark_price
        type: Decimal
      - name: day_volume
        type: Decimal

  - name: Fill
    description: market trade event
    values:
      - name: symbol
        type: String
      - name: price
        type: Decimal
      - name: volume
        type: Decimal
      - name: side
        type: OrderSide
      - name: timestamp_ms
        type: i64
      - name: trade_id
        type: i64

  - name: Position
    description: open trading position
    values:
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: size
        type: Decimal
      - name: entry_price
        type: Decimal

  - name: OpenOrder
    description: resting order
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: price
        type: Decimal
      - name: quantity
        type: Decimal
      - name: filled_quantity
        type: Decimal

  - name: OrderPlacement
    description: order placement response
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: price
        type: Decimal
      - name: quantity
        type: Decimal
      - name: timestamp_ms
        type: i64

  - name: UserFill
    description: execution of the user's own order
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: side
        type: OrderSide
      - name: price
        type: Decimal
      - name: quantity
        type: Decimal
      - name: fee_usd
        type: Decimal
      - name: timestamp_ms
        type: i64

  - name: OrderUpdate
    description: order lifecycle update
    values:
      - name: order_id
        type: i64
      - name: symbol
        type: String
      - name: status
        type: OrderStatus
      - name: side
        type: Option<OrderSide>
      - name: price
        type: Option<Decimal>
      - name: quantity
        type: Option<Decimal>
      - name: remaining_quantity
        type: Option<Decimal>
      - name: timestamp_ms
        type: i64

  - name: FundingPayment
    description: funding payment applied to a position
    values:
      - name: symbol
        type: String
      - name: amount_usd
        type: Decimal
      - name: timestamp_ms
        type: i64

  - name: Deposit
    description: deposit event
    values:
      - name: asset
        type: String
      - name: amount_usd
        type: Decimal
      - name: timestamp_ms
        type: i64

  - name: Withdrawal
    description: withdrawal event
    values:
      - name: asset
        type: String
      - name: amount_usd
        type: Decimal
      - name: timestamp_ms
        type: i64