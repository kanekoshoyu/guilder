[package]
name = "guilder-client-hyperliquid"
version = "0.4.5"
edition = "2021"
description = "Hyperliquid client for the guilder multi-exchange crypto trading library"
authors = ["Sho Kaneko <kanekoshoyu@gmail.com>"]
repository = "https://github.com/kanekoshoyu/guilder"
license = "MIT"

[[bin]]
name = "guilder-stress-test"
path = "src/bin/guilder_stress_test.rs"

[dependencies]
# development: path, deployment: version
guilder-abstraction = "0.1.16"
reqwest = { workspace = true, features = ["json"] }
futures-core.workspace = true
futures-util = "0.3"
serde = { workspace = true }
serde_json.workspace = true
rust_decimal = "1"
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
async-stream = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.11"
hex = "0.4"
rmp-serde = "1"
tracing = "0.1"
