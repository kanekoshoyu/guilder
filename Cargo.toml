[workspace]
resolver = "2"
members = [
    "core", # common trading components (orderbook, currency pair, account)
    "abstraction/codegen", # codegen for guilder trait code
    "abstraction/target/rust", # guilder trait in rust
    "client/*", # implementation of guilder trait
]
exclude = [
    "client/guilder-client-template", # codegen template, not a real crate
    "client/.claude", # claude code config directory
]

[patch.crates-io]
guilder-abstraction = { path = "abstraction/target/rust" }

[workspace.dependencies]
# serde
serde = { version = "1.0.209", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = { version = "1", features = ["preserve_order"] }
# rest api
reqwest = "0.12.7"
# concurrent hashmap
dashmap = "6.0.1"
# async stream trait (no runtime, tokio-compatible)
futures-core = "0.3"
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# account feature deps
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
arc-swap = "1"
