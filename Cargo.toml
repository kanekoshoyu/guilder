[workspace]
resolver = "2"
members = [
    "core", # common trading components on top of guilder trait
    "abstraction/codegen", # codegen for guilder trait code
    "abstraction/target/rust", # guilder trait in rust
    "client/*", # implementation of guilder trait
]
exclude = [
    "client/guilder-client-template", # codegen template, not a real crate
    "client/.claude", # claude code config directory
]

[workspace.dependencies]
# serde
serde = { version = "1.0.209", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1"
# rest api
reqwest = "0.12.7"
# concurrent hashmap
dashmap = "6.0.1"
# ordered f64
ordered-float = "4.2.2"
# async stream trait (no runtime, tokio-compatible)
futures-core = "0.3"
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
